app = "jevons"
primary_region = "sjc"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/app/data"
  DRY_RUN = "true"
  MODEL = "jev"

[http_service]
  internal_port = 3000
  force_https = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  swap_size_mb = 512

[mounts]
  source = "jevons_data"
  destination = "/app/data"
